name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rag-check:
    name: rag - Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx biome check .
      - run: bunx tsc --noEmit

  build-demos:
    name: Build ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [esign, template-builder]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx vite build

  build-rag-web:
    name: Build rag/web
    needs: rag-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: rag
      - run: bunx vite build
        working-directory: rag/apps/web

  smoke:
    name: Smoke - ${{ matrix.demo }}
    needs: build-demos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [esign, template-builder]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Build demo
        working-directory: ${{ matrix.demo }}
        run: |
          bun install
          bunx vite build
      - name: Install Playwright
        working-directory: tests
        run: |
          bun install
          bunx playwright install --with-deps chromium
      - name: Run smoke test
        working-directory: tests
        env:
          DEMO: ${{ matrix.demo }}
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-${{ matrix.demo }}
          path: tests/test-results/
          retention-days: 7
